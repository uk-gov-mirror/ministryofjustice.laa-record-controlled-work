nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: modsec-non-prod
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecDefaultAction "phase:2,pass,log,tag:github_team=laa-record-controlled-work"
    external-dns.alpha.kubernetes.io/set-identifier: ""
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "15552001"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"

rcw:
  networkPolicy:
    enabled: true
    policies:
      - name: rcw-ingress-from-nginx-and-ccq
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: '{{ include "laa-record-controlled-work.name" $ }}'
                    app.kubernetes.io/instance: '{{ $.Release.Name }}'
                    app.kubernetes.io/component: nginx
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: '{{ include "laa-record-controlled-work.name" $ }}'
                    app.kubernetes.io/instance: '{{ $.Release.Name }}'
                    app.kubernetes.io/component: ccq
            ports:
              - protocol: TCP
                port: 3000
      - name: rcw-egress-to-k8s-dns
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: UDP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
          - action: Allow
            protocol: TCP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
      - name: rcw-egress-to-rcw-api
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'laa-record-controlled-work-api-{{ $.Values.rcw.env.NODE_ENV }}'"
              selector: "app.kubernetes.io/name == 'laa-record-controlled-work-api' && app.kubernetes.io/instance == 'laa-record-controlled-work-api'"
              ports:
                - 8081
      - name: rcw-egress-to-redis
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              nets:
                - 172.20.0.0/16 # Cloud Platform AWS VPC - for Redis
              ports:
                - 6379
      - name: rcw-egress-to-cloud-platform
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              nets:
                - 172.20.0.0/16
              ports:
                - 443
      - name: rcw-egress-to-sentry
        policyTypes:
          - Egress
        egress:
          # Sentry US organization-subdomain event ingestion ranges.
          # https://docs.sentry.io/security-legal-pii/security/ip-ranges/#event-ingestion
          - action: Allow
            protocol: TCP
            destination:
              nets:
                - 34.160.81.0/32
                - 34.102.210.18/32
                - 2600:1901:0:5e8a::/64
                - 2600:1901:0:7edb::/64
              ports:
                - 443
      - name: rcw-egress-to-entra
        policyTypes:
          - Egress
        egress:
          # Microsoft Entra ID (login.microsoftonline.com) - OpenID discovery + JWKS for JWT validation
          # Source: https://learn.microsoft.com/en-us/microsoft-365/enterprise/urls-and-ip-address-ranges (ID 56)
          - action: Allow
            protocol: TCP
            destination:
              nets:
                - 20.20.32.0/19
                - 20.190.128.0/18
                - 20.231.128.0/19
                - 40.126.0.0/18
              ports:
                - 443
  replicaCount: 1

  image:
    repository: nginx
    pullPolicy: Always
    tag: "@sha256:4c41e2d0a3a55b325ed572cd0200bdb72af1433c3daa2bca6ef8eea68ce504a2"

  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 30
    periodSeconds: 60

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 60

  # Secret env vars stored in a Kubernetes Secret, referenced via
  # secretKeyRef in the deployment template.
  #
  # envSecretName:
  #   - The name of the Kubernetes Secret to create/update.
  #   - Scoped per Kubernetes namespace (one per environment), shared across all releases
  #     including ephemeral branches - all releases in a namespace use the
  #     same secret values.
  #
  # envSecrets: 
  #   - Keys to pull from that secret.
  #
  # Helm merges maps (env:) deeply across values files, but replaces
  # lists (envSecrets:) entirely. If an environment needs additional
  # secrets, repeat the full envSecrets: list in its values file.
  envSecretName: rcw-env-secrets
  envSecrets:
    - SESSION_SECRET
    - SESSION_ENCRYPTION_KEY
    - ENTRA_CLIENT_ID
    - ENTRA_CLIENT_SECRET
    - ENTRA_TENANT_ID
    - PDA_API_KEY

  # Plain env vars injected directly into the container. Add new vars 
  # here only, they are automatically picked up by the Helm template and 
  # test workflows (via yq). 
  # 
  # Override per environment by setting the key again in the relevant 
  # values/<env>.yaml file.
  env:
    SERVICE_NAME: "Record Controlled Work"
    SERVICE_PHASE: "Beta"
    DEPARTMENT_NAME: "Legal Aid Agency"
    DEPARTMENT_URL: "https://www.gov.uk/government/organisations/legal-aid-agency"
    CONTACT_EMAIL: "eligibility@justice.gov.uk"
    CONTACT_PHONE: ""
    SERVICE_URL: "https://www.gov.uk/legal-aid"
    RATELIMIT_HEADERS_ENABLED: true
    RATELIMIT_STORAGE_URI: ""
    AUTH_RATE_LIMIT_MAX: 20
    RATE_LIMIT_MAX: 100
    RATE_WINDOW_MS: 900000
    NODE_ENV: ""
    RCW_API_BASE_URL: ""
    PDA_API_BASE_URL: ""
    ENTRA_AUTHORITY_BASE_URL: "https://login.microsoftonline.com/"
    ENTRA_REDIRECT_URI: ""
    REDIS_ENABLED: true  
    REDIS_SECRET_NAME: elasticache-redis
    SENTRY_DSN: "https://34b761d28dfa94a743acb65213b75ed9@o345774.ingest.us.sentry.io/4512061899866112"
    # Not a secret; the key is exposed in every HTTP response header and page source.
    SENTRY_CSP_REPORT_ENDPOINT: "https://o345774.ingest.us.sentry.io/api/4512061899866112/security/?sentry_key=34b761d28dfa94a743acb65213b75ed9" # gitleaks:allow - public Sentry key
    SENTRY_ENV: ""
    SENTRY_DEBUG: false
    SENTRY_ENABLED: true
    SENTRY_LOGGING_ENABLED: true
    SENTRY_TRACING_ENABLED: true
    SENTRY_RELEASE: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

testConnection:
  networkPolicy:
    enabled: true
    policies:
      - name: test-connection-egress-to-k8s-dns
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: UDP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
          - action: Allow
            protocol: TCP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
      - name: test-connection-egress-to-nginx
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              selector: "app.kubernetes.io/name == '{{ include \"laa-record-controlled-work.name\" $ }}' && app.kubernetes.io/instance == '{{ $.Release.Name }}' && app.kubernetes.io/component == 'nginx'"
              ports:
                - 8080

ccq:
  networkPolicy:
    enabled: true
    policies:
      - name: ccq-ingress-from-nginx
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: '{{ include "laa-record-controlled-work.name" $ }}'
                    app.kubernetes.io/instance: '{{ $.Release.Name }}'
                    app.kubernetes.io/component: nginx
            ports:
              - protocol: TCP
                port: 3000
      - name: ccq-egress-to-k8s-dns
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: UDP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
          - action: Allow
            protocol: TCP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
      - name: ccq-egress-to-rcw
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              selector: "app.kubernetes.io/name == '{{ include \"laa-record-controlled-work.name\" $ }}' && app.kubernetes.io/instance == '{{ $.Release.Name }}' && app.kubernetes.io/component == 'rcw'"
              ports:
                - 3000
      - name: ccq-egress-to-redis
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              nets:
                - 172.20.0.0/16
              ports:
                - 6379
      - name: ccq-egress-to-cloud-platform
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              nets:
                - 172.20.0.0/16
              ports:
                - 443
      - name: ccq-egress-to-sentry
        policyTypes:
          - Egress
        egress:
          # Sentry US organization-subdomain event ingestion ranges.
          # https://docs.sentry.io/security-legal-pii/security/ip-ranges/#event-ingestion
          - action: Allow
            protocol: TCP
            destination:
              nets:
                - 34.160.81.0/32
                - 34.102.210.18/32
                - 2600:1901:0:5e8a::/64
                - 2600:1901:0:7edb::/64
              ports:
                - 443
  replicaCount: 1

  image:
    # Overridden at deploy time to ECR; see deploy.sh and docker-images.env
    repository: laa-check-client-qualifies
    pullPolicy: Always
    tag: latest

  envSecretName: ccq-env-secrets
  envSecrets:
    - SECRET_KEY_BASE

  env:
    REDIS_SECRET_NAME: elasticache-redis-ccq
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"

    CCQ_MODE: embedded
    CCQ_EMBEDDED_LAYOUT: rcw/application
    HOST_SERVICE_ELIGIBILITY_ENDPOINT: /api/applications/%<application_id>s/eligibility
    HOST_SERVICE_URL: http://laa-record-controlled-work-rcw:3000
    HOST_SERVICE_SESSION_COOKIES: __Host-rcw.sid

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

nginx:
  networkPolicy:
    enabled: true
    policies:
      - name: nginx-ingress-from-ingress-and-test
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    component: ingress-controllers
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: '{{ include "laa-record-controlled-work.name" $ }}'
                    app.kubernetes.io/instance: '{{ $.Release.Name }}'
                    app.kubernetes.io/component: test-connection
            ports:
              - protocol: TCP
                port: 8080
      - name: nginx-egress-to-k8s-dns
        enabled: false
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: UDP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
          - action: Allow
            protocol: TCP
            destination:
              namespaceSelector: "kubernetes.io/metadata.name == 'kube-system'"
              selector: "k8s-app in {'kube-dns', 'coredns'}"
              ports:
                - 53
      - name: nginx-egress-to-rcw
        enabled: false
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              selector: "app.kubernetes.io/name == '{{ include \"laa-record-controlled-work.name\" $ }}' && app.kubernetes.io/instance == '{{ $.Release.Name }}' && app.kubernetes.io/component == 'rcw'"
              ports:
                - 3000
      - name: nginx-egress-to-ccq
        enabled: false
        policyTypes:
          - Egress
        egress:
          - action: Allow
            protocol: TCP
            destination:
              selector: "app.kubernetes.io/name == '{{ include \"laa-record-controlled-work.name\" $ }}' && app.kubernetes.io/instance == '{{ $.Release.Name }}' && app.kubernetes.io/component == 'ccq'"
              ports:
                - 3000
  replicaCount: 1

  image:
    # Overridden at deploy time to ECR; see deploy.sh and docker-images.env
    repository: nginxinc/nginx-unprivileged
    pullPolicy: Always
    tag: alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e

  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi
