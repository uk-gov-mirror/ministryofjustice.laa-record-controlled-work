serviceAccount:
  name: rcw-github-action-service-account

networkPolicy:
  egress:
    enabled: false
    dns:
      namespace: ""
      podSelector: {}
    rcwApi:
      namespace: laa-record-controlled-work-api-staging
      podSelector: {}
    rcwExternalHttps:
      cidrs: []
    ccqExternalHttps:
      cidrs: []
    redis:
      cidrs: []
    ccqTelemetry:
      enabled: false
      cidrs: []

ingress:
  hosts:
    - host: laa-record-controlled-work-staging.cloud-platform.service.justice.gov.uk
      paths:
        - path: /
          pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: laa-record-controlled-work-laa-record-controlled-work-staging-green

rcw:
  replicaCount: 2

  env:
    NODE_ENV: staging
    SENTRY_ENV: staging
    SENTRY_TRACES_SAMPLE_RATE: 1.0
    ENTRA_REDIRECT_URI: https://laa-record-controlled-work-staging.cloud-platform.service.justice.gov.uk/auth/code/callback
    ENTRA_ADDITIONAL_SCOPES: api://rcw-api-staging/Applications.Read
    RCW_API_BASE_URL: http://laa-record-controlled-work-api.laa-record-controlled-work-api-staging.svc:8081
    PDA_API_BASE_URL: https://laa-provider-details-api-preprod.apps.live.cloud-platform.service.justice.gov.uk

ccq:
  replicaCount: 2