{{- if .Values.rcw.networkPolicy.enabled }}
{{- include "laa-record-controlled-work.validateNetworkPolicies" (dict
  "policyPath" "rcw.networkPolicy.policies"
  "policies" .Values.rcw.networkPolicy.policies
) }}
{{- range $policy := .Values.rcw.networkPolicy.policies }}
{{- if or (not (hasKey $policy "enabled")) $policy.enabled }}
{{- $policyTypes := $policy.policyTypes }}
{{- if $policyTypes }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laa-record-controlled-work.fullname" $ }}-{{ $policy.name }}
  labels:
    {{- include "laa-record-controlled-work.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "laa-record-controlled-work.name" $ | quote }}
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: rcw
  policyTypes:
    {{- toYaml $policyTypes | nindent 4 }}
{{- if has "Ingress" $policyTypes }}
  ingress:
    {{- tpl (toYaml $policy.ingress) $ | nindent 4 }}
{{- end }}
{{- if has "Egress" $policyTypes }}
  egress:
    {{- tpl (toYaml $policy.egress) $ | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}