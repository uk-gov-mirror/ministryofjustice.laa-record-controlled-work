{{- if .Values.networkPolicy.egress.enabled }}
{{- include "laa-record-controlled-work.egress.validate" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laa-record-controlled-work.fullname" . }}-test-connection-egress-policy
  labels:
    {{- include "laa-record-controlled-work.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laa-record-controlled-work.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: test-connection
  policyTypes:
    - Egress
  egress:
    {{- include "laa-record-controlled-work.egress.dnsRule" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "laa-record-controlled-work.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: nginx
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
